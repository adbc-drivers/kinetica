repos:
- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    exclude: >
        (?x)^(
            .*Cargo\.(toml|lock)$
        )$
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--enforce-all"]
  - id: check-case-conflict
  - id: check-executables-have-shebangs
  - id: check-toml
  - id: check-yaml
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: trailing-whitespace
- repo: https://github.com/koalaman/shellcheck-precommit
  rev: 99470f5e12208ff0fb17ab81c3c494f7620a1d8d  # frozen: v0.11.0
  hooks:
  - id: shellcheck
- repo: https://github.com/adbc-drivers/dev
  rev: e843cec0de3428ead687d3135394683b28e841ff
  hooks:
  - id: rat
- repo: local
  hooks:
  - id: cargo fmt
    name: cargo fmt
    language: system
    types: [rust]
    entry: bash -c 'cd rust && cargo +stable fmt --all'
    pass_filenames: false
