# What adbc-gen-workflow (from github.com/adbc-drivers/dev) writes this
# repository's workflows, pixi.toml and CI scripts from.

driver = "kinetica"

# The driver is a Rust workspace in rust/, the default subdirectory for Rust.

# The validation suite (rust/validation/) runs against the Kinetica that
# rust/compose.yaml starts as its test-service, and fills in docs/kinetica.md.
# The vendor version is the Kinetica version the driver's version follows.
[[lang.rust.validation.configs]]
vendor-version = "7.2"
