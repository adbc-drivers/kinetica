# What the test instance's configuration differs in from the image's own.
#
# The image's start script merges this over its template on first start
# (GPUDB_CONF in compose.yaml), so only the settings that change are here.
# The section header is required; the merge refuses a file without one.

[gaia]

# Log in as the tests do, rather than everyone being admin.
enable_authorization = true

# The workers advertise the container's bridge address by default, which the
# host cannot reach, and a client that cannot reach a worker falls back to
# the head without saying so. Advertised on localhost, the published ports
# 9192 and 9193 are where multi-head ingest goes.
host0.public_address = 127.0.0.1
host0.host_manager_public_url = http://127.0.0.1:9300

# Memory. Neither is used by a test; the stats server's absence is logged as
# an error at startup ("Unable to start subsystems (stats)"), which is
# harmless: the database comes up without it.
enable_reveal = false
enable_stats_server = false

# The same instance serves the other connectors' test suites, which use these.
enable_text_search = true
enable_vectortile_service = true
