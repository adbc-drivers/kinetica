driver = "kinetica"

[lang]
lang = "rust"
# The crate that builds the shared library, a member of this workspace. Named
# as a member, not by manifest-path, so the build looks for the library in the
# workspace's target directory, where cargo puts it.
crate-path = "crates/kinetica-adbc"
# Exports AdbcDriverKineticaInit, the entry point manifest.toml names. It is a
# default feature, named so the build does not depend on the defaults.
features = ["driver_exporter"]
