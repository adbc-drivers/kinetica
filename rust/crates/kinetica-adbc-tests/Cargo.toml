[package]
name = "kinetica-adbc-tests"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
kinetica-adbc = { path = "../kinetica-adbc" }
# The helper reaches /show/table directly: sys_sql_temp is not visible
# through the driver, so cleanup cannot be asserted without this.
gpudb-api = "~7.2.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
adbc_core = "0.24"
arrow-array = ">=58, <60"
# Renders a value of any type for a failure message.
arrow-cast = ">=58, <60"
arrow-schema = ">=58, <60"
env_logger = "0.11"
# The key auth.rs signs with, made at run time: both already come in through
# jsonwebtoken
rand = "0.8"
rsa = "0.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
